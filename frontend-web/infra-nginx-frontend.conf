# FLICK frontend — servi derrière le reverse proxy (jamais exposé direct).
# Écoute non-privilégiée (image nginx-unprivileged).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (complètent ceux du reverse proxy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets fingerprintés Vite (assets/ + .png hashé) : cache long immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA : toute route inconnue → index.html (React Router).
    location / {
        expires 5m;
        add_header Cache-Control "public" always;
        try_files $uri $uri/ /index.html;
    }

    # Santé interne (healthcheck Docker).
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
