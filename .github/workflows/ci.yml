# ============================================================
# FLICK — CI (étapes 21→23) : lint, type-check, tests, builds,
# validation Docker/Compose. Aucun secret, aucun déploiement :
# la production ne part qu'après validation explicite (DEPLOY.md).
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn test
      - run: mvn clean package -DskipTests

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.prod.yml config --quiet
      - run: docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.staging.yml config --quiet
      # Mot de passe factice UNIQUEMENT pour valider le YAML (fail-fast conservé en réel).
      - run: GRAFANA_ADMIN_PASSWORD=ci-validation-only docker compose -f infra/docker-compose.prod.yml -f infra/monitoring/docker-compose.monitoring.yml --profile monitoring config --quiet
      - run: docker build -t flick-backend:ci ./backend
      - run: docker build -t flick-frontend:ci ./frontend-web
