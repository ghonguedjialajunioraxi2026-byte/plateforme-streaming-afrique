# ============================================================
# FLICK — reverse proxy public (Nginx, point d'entrée UNIQUE)
#
# Domaines PLACEHOLDER — adapter au déploiement réel (voir DEPLOY.md) :
#   app.flick.example  → frontend (ce proxy)
#   (l'API, le WS et le HLS passent par ce même hôte en chemins, pas
#   besoin de sous-domaines séparés pour la première version prod)
#
# Routage :
#   /          → frontend:8080 (statique Vite)
#   /api/      → backend:8080  (REST, préfixe conservé)
#   /ws/       → backend:8080  (WebSocket STOMP, upgrade + timeouts longs)
#   /hls/      → srs:18080/    (lecture HLS, préfixe retiré)
# JAMAIS exposés : /actuator/** (sauf via réseau interne), /api/ingest/**,
# :5432, :6379, :1985, backend:8080 direct.
#
# TLS : certificats montés en /etc/nginx/certs/ (fullchain.pem + privkey.pem,
# jamais dans Git — certbot sur le serveur, voir DEPLOY.md).
# ============================================================

upstream frontend {
    server frontend:8080 max_fails=3 fail_timeout=10s;
}

upstream backend {
    server backend:8080 max_fails=3 fail_timeout=10s;
}

upstream hls {
    server srs:18080 max_fails=3 fail_timeout=10s;
}

# Journal structuré avec identifiant de requête (corrélé au MDC backend).
log_format flick '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rt=$request_time uct=$upstream_connect_time '
                'urt=$upstream_response_time rid=$request_id';

# Anti-abus minimal au bord (complète le rate limiting métier Redis) :
# login/inscription : rafales courtes uniquement.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name app.flick.example;

    # Défi ACME (certbot) + redirection HTTPS sinon.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.flick.example;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS : mémorise HTTPS 6 mois (subdomains inclus, preload volontairement absent).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP de base : resserrer si un CDN/une source externe s'ajoute.
    # 'unsafe-inline' requis par le bundle Vite actuel (styles inline) —
    # le durcir (nonces) appartient à une étape frontend dédiée.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: https:; frame-src https://accounts.google.com; font-src 'self' data:" always;

    access_log /var/log/nginx/flick_access.log flick;
    error_log /var/log/nginx/flick_error.log warn;

    # Santé interne (healthcheck Docker, interne uniquement).
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Identifiant de requête propagé au backend (corrél. logs MDC requestId).
    proxy_set_header X-Request-Id $request_id;

    # Uploads vidéo (512 Mo max côté métier + marge multipart).
    client_max_body_size 550m;
    client_body_timeout 120s;

    # Actuator et ingest : jamais exposés publiquement (réseau interne seul).
    location /actuator/ {
        return 404;
    }
    location = /actuator {
        return 404;
    }
    location /api/ingest/ {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Frontend ----
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API backend ----
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- WebSocket STOMP (handshake + frames, sessions longues) ----
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Lecture HLS (segments + playlists, cache CDN-friendly) ----
    location /hls/ {
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://hls;
        proxy_set_header Host $host;
        proxy_buffering on;
        proxy_cache_valid 200 10s;
        add_header Cache-Control "public, max-age=10" always;
    }
}
