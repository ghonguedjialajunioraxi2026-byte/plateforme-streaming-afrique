# ============================================================
# FLICK — stack de PRODUCTION (MODÈLE, NON DÉPLOYÉ)
#
# Ce fichier est un MODÈLE — il ne tourne pas tel quel sans
# secrets réels fournis par l'environnement du serveur.
# Aucune valeur "dev-only" : si DB_PASSWORD / JWT_SECRET /
# REDIS_PASSWORD / CORS_ALLOWED_ORIGINS / INGEST_CALLBACK_SECRET
# manquent, le backend REFUSE de démarrer (échec rapide = sécurité).
#
# Lancement (sur le serveur, voir docs/infrastructure/DEPLOY.md) :
#   1. renseigner l'environnement (jamais dans Git, jamais dans l'image)
#   2. générer infra/srs/srs.conf depuis srs.conf.template (secret ingest)
#   3. déposer les certificats TLS dans infra/proxy/certs/
#   4. docker compose -f infra/docker-compose.prod.yml up -d --build
#
# Secrets requis : DB_PASSWORD, JWT_SECRET, REDIS_PASSWORD,
# CORS_ALLOWED_ORIGINS, INGEST_CALLBACK_SECRET (+ PAYMENT_WEBHOOK_SECRET,
# GOOGLE_CLIENT_ID selon modules activés).
#
# Réseaux : public (proxy seul exposé) / app (trafic inter-services ;
# backend avec accès sortant pour Google/IA/paiements, mais AUCUN port
# publié donc injoignable depuis Internet) / data INTERNE (postgres,
# redis — même pas de sortie, backend seul les joint).
# La vraie barrière inbound = ports publiés (80/443/1935 seuls) + firewall
# (voir DEPLOY.md) ; data est en plus isolée au niveau Docker.
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ----------------------------------------------------------
  # Reverse proxy : SEUL point d'entrée public (80/443).
  # ----------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/flick.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
      - proxy_logs:/var/log/nginx
    networks:
      - public
      - app
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------
  # Frontend statique (jamais exposé direct, via proxy uniquement).
  # ----------------------------------------------------------
  frontend:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://app.flick.example/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://app.flick.example}
    image: flick-frontend:${FRONTEND_VERSION:-staging}
    restart: unless-stopped
    networks:
      - app
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------
  # Backend Java (jamais exposé direct, via proxy uniquement).
  # ----------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: flick-backend:${BACKEND_VERSION:-staging}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL: ${REDIS_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_TRUST_PROXY: "true"
      RTMP_INGEST_URL: ${RTMP_INGEST_URL:-rtmp://app.flick.example:1935/live}
      HLS_BASE_URL: ${HLS_BASE_URL:-https://app.flick.example/hls}
      SRS_API_URL: http://srs:1985/api/v1
      INGEST_CALLBACK_SECRET: ${INGEST_CALLBACK_SECRET}
      PAYMENTS_SANDBOX_ENABLED: "false"
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      # --- Email transactionnel (vérification, récupération, alertes).
      # Sans SMTP configuré, le backend n'envoie RIEN (NoOp, étape 23) :
      # la récupération de compte est alors indisponible — à brancher
      # avant toute ouverture avec mot de passe (voir DEPLOY.md).
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@flick.example}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.flick.example}
      # OAuth Google (vide = bouton désactivé + 503 explicite côté backend).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BETA_INVITE_ONLY: ${BETA_INVITE_ONLY:-false}
      BETA_INVITATION_TTL: ${BETA_INVITATION_TTL:-14d}
      VIDEO_FFMPEG_ENABLED: ${VIDEO_FFMPEG_ENABLED:-false}
      STORAGE_LOCATION: /app/uploads
      TZ: UTC
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx1024m}
    networks:
      - app
      - data
    volumes:
      - uploads:/app/uploads
      - backend_logs:/app/logs
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ----------------------------------------------------------
  # PostgreSQL : réseau data uniquement (jamais public).
  # Compte applicatif au moindre privilège (voir DEPLOY.md § base).
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - data
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # Redis : réseau data uniquement. AUTH obligatoire, persistance AOF
  # (rate limiting + présence + compteurs survivent au redémarrage ;
  # PostgreSQL reste la source de vérité métier).
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}",
      "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - data
    volumes:
      - redisdata:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # Serveur média SRS : RTMP ingest (OBS), HLS (lecteurs), API interne.
  # Auth ingest via hook on_publish → backend (secret partagé).
  # 1935 public (créateurs) ; 18080/1985 internes uniquement.
  # ----------------------------------------------------------
  srs:
    image: ossrs/srs:5
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "1935:1935"
    volumes:
      # Surcharge la configuration par défaut (commande d'origine conservée).
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    networks:
      - app
    logging: *default-logging

networks:
  public:
  app:
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
  uploads:
  backend_logs:
  proxy_logs:
