# ============================================================
# FLICK — monitoring OPT-IN (profil "monitoring")
# Usage (depuis infra/) :
#   docker compose -f docker-compose.prod.yml \
#                  -f monitoring/docker-compose.monitoring.yml \
#                  --profile monitoring up -d
# Mêmes réseaux que la prod (projet unique) ; Prometheus scape le
# backend via le réseau interne (jamais exposé publiquement) ;
# Grafana derrière le proxy ? NON par défaut — localhost + SSH.
# ============================================================

services:
  prometheus:
    image: prom/prometheus:v3.3.0
    restart: unless-stopped
    profiles: [monitoring]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    profiles: [monitoring]
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?mot de passe Grafana requis}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - app
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  app:
  data:
    internal: true

volumes:
  prometheus_data:
  grafana_data:
