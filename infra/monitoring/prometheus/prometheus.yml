# FLICK — Prometheus : scrape le backend sur le réseau interne.
# Métriques réelles : /actuator/prometheus (Micrometer : JVM, HTTP, Hikari…).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flick-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
